name: Publish to PyPI and GitHub

on:
  push:
    tags:
      - 'v*' # Trigger workflow automatically when a version tag (e.g., v0.1.0) is pushed

jobs:
  build-publish-release:
    name: Build, Publish, and Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing
      contents: write  # Mandatory for creating GitHub Releases
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Extract Tag and Version
        id: vars
        run: |
          # Strips the refs/tags/ prefix to get raw tag (e.g., v0.1.0)
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          # Strips the refs/tags/v prefix to get raw version (e.g., 0.1.0)
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install build tools
        run: python -m pip install build
        
      - name: Build package
        run: python -m build
        
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Jalgo-editor ${{ env.TAG }}
          generate_release_notes: true
